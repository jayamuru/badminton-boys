[build]
  command = "npm run build"
  publish = "dist"

# The app uses a HashRouter, so every route is served by index.html anyway and
# no SPA rewrite rule is needed. This catch-all just covers direct deep links.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
